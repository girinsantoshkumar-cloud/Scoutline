groups:
  - name: scoutline-api
    rules:
      - alert: ScoutlineBackendDown
        expr: up{job="scoutline-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scoutline backend scrape target is down"
          description: "Prometheus has been unable to scrape the Scoutline backend for 2 minutes."

      - alert: ScoutlineHighHttp5xxRate
        expr: |
          (
            sum(rate(scoutline_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(scoutline_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scoutline HTTP 5xx rate is elevated"
          description: "More than 5% of observed requests have returned 5xx responses for 5 minutes."

      - alert: ScoutlineHighRequestLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(scoutline_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Scoutline p95 request latency is high"
          description: "p95 request latency has exceeded one second for 10 minutes."
